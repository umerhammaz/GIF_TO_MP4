<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GIF → MP4</title>
<style>
  :root{--bg:#0a0a0a;--panel:#141414;--line:#2a2a2a;--mid:#6b6b6b;--text:#eaeaea;--white:#fff}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  main{width:min(720px,100%)}
  h1{font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
  .sub{color:var(--mid);font-size:.85rem;margin-bottom:24px}
  #drop{border:2px dashed var(--mid);border-radius:14px;background:var(--panel);padding:56px 20px;
    text-align:center;cursor:pointer;transition:.2s}
  #drop:hover,#drop.over{border-color:var(--white);background:#1c1c1c;transform:scale(1.01)}
  #drop b{display:block;font-size:1.1rem;margin-bottom:6px}
  #drop span{color:var(--mid);font-size:.8rem}
  input[type=file]{display:none}
  #list{margin-top:20px;display:grid;gap:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
    display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center}
  .item img,.item video{width:84px;height:84px;object-fit:cover;border-radius:8px;filter:grayscale(1);background:#000}
  .name{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--mid);font-size:.75rem;margin:4px 0 8px}
  .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--white);transition:width .2s}
  a.btn,button{background:var(--white);color:#000;border:0;border-radius:8px;padding:9px 14px;
    font:inherit;font-size:.8rem;font-weight:700;text-decoration:none;cursor:pointer}
  a.btn:hover,button:hover{background:#bbb}
  #status{margin-top:16px;color:var(--mid);font-size:.8rem;text-align:center;min-height:1em}
</style>
</head>
<body>
<main>
  <h1>GIF → MP4</h1>
  <p class="sub">Instant. Private. Converted in your browser.</p>

  <label id="drop">
    <b>Drop GIFs here</b>
    <span>or click to browse (multiple files supported)</span>
    <input id="file" type="file" accept="image/gif" multiple />
  </label>

  <div id="list"></div>
  <p id="status">Loading converter engine…</p>
</main>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const { FFmpeg } = FFmpegWASM;
const { toBlobURL, fetchFile } = FFmpegUtil;
const $ = s => document.querySelector(s);
const drop = $('#drop'), input = $('#file'), list = $('#list'), status = $('#status');

const ffmpeg = new FFmpeg();
let ready = false, queue = Promise.resolve(), currentBar = null;

ffmpeg.on('progress', ({ progress }) => {
  if (currentBar) currentBar.style.width = Math.min(100, Math.max(0, progress * 100)) + '%';
});

(async function init() {
  try {
    const base = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
    const ffBase = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';
    await ffmpeg.load({
      coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
      wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      classWorkerURL: await toBlobURL(`${ffBase}/814.ffmpeg.js`, 'text/javascript'),
    });
    ready = true;
    status.textContent = 'Ready. Drop a GIF.';
  } catch (e) {
    console.error(e);
    status.textContent = 'Failed to load engine. Serve this page over http(s) and check your connection.';
  }
})();

['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));
input.addEventListener('change', () => { handle(input.files); input.value = ''; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

function handle(files) {
  [...files].filter(f => f.type === 'image/gif' || /\.gif$/i.test(f.name))
    .forEach(f => queue = queue.then(() => convert(f)));
}

const kb = n => (n / 1024).toFixed(n > 1048576 ? 0 : 1) + ' KB';

async function convert(file) {
  if (!ready) { status.textContent = 'Engine still loading…'; return; }
  const item = document.createElement('div');
  item.className = 'item';
  const thumb = URL.createObjectURL(file);
  item.innerHTML = `<img src="${thumb}" alt="">
    <div><div class="name"></div><div class="meta">${kb(file.size)} · converting…</div>
    <div class="bar"><i></i></div></div><div class="act"></div>`;
  item.querySelector('.name').textContent = file.name;
  list.prepend(item);
  const bar = item.querySelector('.bar i'), meta = item.querySelector('.meta');
  currentBar = bar;
  status.textContent = 'Converting…';

  try {
    await ffmpeg.writeFile('in.gif', await fetchFile(file));
    await ffmpeg.exec([
      '-i', 'in.gif',
      '-movflags', 'faststart',
      '-pix_fmt', 'yuv420p',
      '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
      '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
      'out.mp4'
    ]);
    const data = await ffmpeg.readFile('out.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    bar.style.width = '100%';
    meta.textContent = `${kb(file.size)} → ${kb(blob.size)} · done`;
    const a = document.createElement('a');
    a.className = 'btn'; a.href = url;
    a.download = file.name.replace(/\.gif$/i, '') + '.mp4';
    a.textContent = 'Download';
    item.querySelector('.act').append(a);
    const v = document.createElement('video');
    v.src = url; v.muted = v.loop = v.autoplay = v.playsInline = true;
    item.querySelector('img').replaceWith(v);
    await ffmpeg.deleteFile('in.gif'); await ffmpeg.deleteFile('out.mp4');
    status.textContent = 'Done. Drop more.';
  } catch (err) {
    console.error(err);
    meta.textContent = 'Conversion failed';
    status.textContent = 'Something went wrong. See console.';
  }
}
</script>
</body>
</html>
