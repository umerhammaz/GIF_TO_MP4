<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GIF → MP4</title>
<style>
  :root{--bg:#0a0a0a;--panel:#141414;--line:#262626;--mid:#737373;--text:#e5e5e5;--white:#fff;--green:#22c55e;--green-bg:#14532d40;--red:#ef4444}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  main{width:min(760px,100%);justify-self:center}
  h1{font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
  .sub{color:var(--mid);font-size:.85rem;margin-bottom:20px}
  #drop{display:block;width:100%;border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:46px 20px;
    text-align:center;cursor:pointer;transition:.15s ease}
  #drop:hover,#drop.over{border-color:var(--white);background:#1a1a1a}
  #drop b{display:block;font-size:1.05rem;margin-bottom:6px}
  #drop span{color:var(--mid);font-size:.8rem}
  input[type=file]{display:none}
  #batch-bar{display:none;margin-top:16px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    justify-content:space-between;align-items:center}
  .batch-actions{display:flex;gap:8px}
  #list{margin-top:16px;display:grid;gap:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
    display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center}
  .item img,.item video{width:84px;height:84px;object-fit:cover;border-radius:8px;filter:grayscale(1);background:#000}
  .name{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--mid);font-size:.75rem;margin:5px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{background:var(--green-bg);color:var(--green);font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--green)}
  .engine{background:#262626;color:#a3a3a3;font-size:.68rem;padding:2px 5px;border-radius:3px}
  .err{color:var(--red)}
  .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--white);transition:width .15s}
  .act{display:flex;gap:8px;align-items:center}
  a.btn,button.btn{background:var(--white);color:#000;border:0;border-radius:8px;padding:8px 12px;
    font:inherit;font-size:.8rem;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}
  a.btn:hover,button.btn:hover{background:#d4d4d4}
  button.sec{background:transparent;color:var(--mid);border:1px solid var(--line);padding:7px 10px}
  button.sec:hover{color:var(--text);border-color:var(--mid);background:transparent}
  #status{margin-top:16px;color:var(--mid);font-size:.8rem;text-align:center;min-height:1.2em}
</style>
</head>
<body>
<main>
  <h1>GIF → MP4</h1>
  <p class="sub">Instant GPU pipeline. Zero WASM downloads. Paste (Ctrl+V) or Drop.</p>

  <label id="drop">
    <b>Drop GIFs here or Paste (Ctrl+V)</b>
    <span>Total engine weight: ~23 KB · Infinite batching</span>
    <input id="file" type="file" accept="image/gif" multiple />
  </label>

  <div id="batch-bar">
    <span id="batch-count" style="font-size:.85rem;color:var(--mid)">0 files converted</span>
    <div class="batch-actions">
      <button class="btn" id="btn-download-all">Download All</button>
      <button class="btn sec" id="btn-clear-all">Clear</button>
    </div>
  </div>

  <div id="list"></div>
  <p id="status">Ready. Drop GIFs or paste from clipboard.</p>
</main>

<!-- Total combined engine weight: ~23 KB (Zero 31 MB WASM downloads) -->
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), input = $('#file'), list = $('#list'), status = $('#status');
const batchBar = $('#batch-bar'), batchCount = $('#batch-count');
const btnDownloadAll = $('#btn-download-all'), btnClearAll = $('#btn-clear-all');

const activeUrls = new Set();
const completedItems = [];
let queue = Promise.resolve();

const kb = n => (n / 1024).toFixed(n > 1048576 ? 0 : 1) + ' KB';

function createTrackedUrl(blob) {
  const url = URL.createObjectURL(blob);
  activeUrls.add(url);
  return url;
}

function releaseUrl(url) {
  if (url && activeUrls.has(url)) {
    URL.revokeObjectURL(url);
    activeUrls.delete(url);
  }
}

function createWorkCanvas(w, h) {
  return typeof OffscreenCanvas !== 'undefined'
    ? new OffscreenCanvas(w, h)
    : Object.assign(document.createElement('canvas'), { width: w, height: h });
}

// Layer 1: Zero-Memory Binary Sieve (Pixel-bomb & sanity gatekeeper)
async function validateGif(file) {
  if (file.size < 16) throw new Error('File too small to be a valid GIF.');
  const slice = await file.slice(0, 16).arrayBuffer();
  const bytes = new Uint8Array(slice);
  const sig = String.fromCharCode(...bytes.subarray(0, 6));
  if (sig !== 'GIF87a' && sig !== 'GIF89a') {
    throw new Error(`Invalid signature (${sig || 'unknown'}). Only GIF files supported.`);
  }
  const width = bytes[6] | (bytes[7] << 8);
  const height = bytes[8] | (bytes[9] << 8);
  if (width === 0 || height === 0) throw new Error('Invalid dimensions (0x0).');
  if (width > 4096 || height > 4096) {
    throw new Error(`Safety limit: ${width}×${height} exceeds 4096px ceiling.`);
  }
  return { width, height };
}

// Hardware profile selection for 720p, 1080p, 1440p, 4K
async function negotiateH264Config(width, height) {
  const profiles = [
    'avc1.640033', // High 5.1 (4K / 60fps)
    'avc1.4d002a', // Main 4.2 (1080p)
    'avc1.4d0028', // Main 4.0
    'avc1.420028', // Baseline 4.0
    'avc1.42001f'  // Baseline 3.1
  ];

  const bitrate = Math.min(8_000_000, Math.max(1_000_000, Math.round(width * height * 4)));

  for (const codec of profiles) {
    const config = { codec, width, height, bitrate, framerate: 30 };
    try {
      const check = await VideoEncoder.isConfigSupported(config);
      if (check && check.supported) return check.config || config;
    } catch (_) {}
  }
  return { codec: 'avc1.4d002a', width, height, bitrate, framerate: 30 };
}

// Tier 1: Native WebCodecs Pipeline (Chromium / Safari)
async function convertWebCodecs(buffer, onProgress) {
  const decoder = new ImageDecoder({ data: buffer, type: 'image/gif' });
  await decoder.tracks.ready;
  const frameCount = decoder.tracks.selectedTrack.frameCount;
  if (!frameCount || frameCount <= 0) throw new Error('No frames found in GIF');

  const probe = await decoder.decode({ frameIndex: 0 });
  const srcW = probe.image.displayWidth;
  const srcH = probe.image.displayHeight;
  probe.image.close();

  const width = srcW - (srcW % 2);
  const height = srcH - (srcH % 2);
  const needsScale = (width !== srcW || height !== srcH);

  let canvas = null, ctx = null;
  if (needsScale) {
    canvas = createWorkCanvas(width, height);
    ctx = canvas.getContext('2d');
  }

  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width, height },
    fastStart: 'in-memory',
    firstTimestampBehavior: 'offset'
  });

  let encoderError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encoderError = e; }
  });

  const encoderConfig = await negotiateH264Config(width, height);
  encoder.configure(encoderConfig);

  let curTimestamp = 0;
  for (let i = 0; i < frameCount; i++) {
    if (encoderError) throw encoderError;
    const { image } = await decoder.decode({ frameIndex: i });
    const duration = image.duration || 100000;
    let targetFrame = image;

    if (needsScale) {
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(image, 0, 0, width, height);
      targetFrame = new VideoFrame(canvas, { timestamp: curTimestamp, duration });
      image.close();
    } else if (image.timestamp === null || image.timestamp === undefined) {
      targetFrame = new VideoFrame(image, { timestamp: curTimestamp, duration });
      image.close();
    }

    encoder.encode(targetFrame, { keyFrame: i % 30 === 0 });
    targetFrame.close();
    curTimestamp += duration;
    onProgress((i + 1) / frameCount);
  }

  await encoder.flush();
  encoder.close();
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}

// Tier 2: Universal Fallback Engine (omggif + VideoEncoder or MediaRecorder)
async function convertUniversal(buffer, onProgress) {
  const reader = new omggif.GifReader(new Uint8Array(buffer));
  const srcW = reader.width;
  const srcH = reader.height;
  const width = srcW - (srcW % 2);
  const height = srcH - (srcH % 2);
  const frameCount = reader.numFrames();
  if (frameCount <= 0) throw new Error('No frames in GIF.');

  const mainCanvas = createWorkCanvas(width, height);
  const mainCtx = mainCanvas.getContext('2d');
  const frameCanvas = createWorkCanvas(srcW, srcH);
  const frameCtx = frameCanvas.getContext('2d');
  const pixelBuffer = new Uint8Array(srcW * srcH * 4);

  // Path A: Hardware VideoEncoder with omggif frames
  if ('VideoEncoder' in window && typeof Mp4Muxer !== 'undefined') {
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width, height },
      fastStart: 'in-memory',
      firstTimestampBehavior: 'offset'
    });

    let encoderErr = null;
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encoderErr = e; }
    });

    const encoderConfig = await negotiateH264Config(width, height);
    encoder.configure(encoderConfig);

    let curTimestamp = 0;
    for (let i = 0; i < frameCount; i++) {
      if (encoderErr) throw encoderErr;
      const info = reader.frameInfo(i);
      const duration = (info.delay && info.delay > 0 ? info.delay : 10) * 10000;

      reader.decodeAndBlitFrameRGBA(i, pixelBuffer);
      const imgData = new ImageData(new Uint8ClampedArray(pixelBuffer.buffer), srcW, srcH);
      frameCtx.putImageData(imgData, 0, 0);

      mainCtx.clearRect(0, 0, width, height);
      mainCtx.drawImage(frameCanvas, 0, 0, width, height);

      const frame = new VideoFrame(mainCanvas, { timestamp: curTimestamp, duration });
      encoder.encode(frame, { keyFrame: i % 30 === 0 });
      frame.close();

      curTimestamp += duration;
      onProgress((i + 1) / frameCount);
    }

    await encoder.flush();
    encoder.close();
    muxer.finalize();
    return new Blob([muxer.target.buffer], { type: 'video/mp4' });
  }

  // Path B: Zero-library MediaRecorder fallback (for legacy browsers)
  return new Promise((resolve, reject) => {
    let mimeType = 'video/mp4';
    if (!MediaRecorder.isTypeSupported('video/mp4')) {
      mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    }

    const stream = mainCanvas.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
    rec.onerror = e => reject(e.error || new Error('MediaRecorder recording failed'));

    rec.start();
    let i = 0;
    function step() {
      if (i >= frameCount) { rec.stop(); return; }
      reader.decodeAndBlitFrameRGBA(i, pixelBuffer);
      const imgData = new ImageData(new Uint8ClampedArray(pixelBuffer.buffer), srcW, srcH);
      frameCtx.putImageData(imgData, 0, 0);
      mainCtx.clearRect(0, 0, width, height);
      mainCtx.drawImage(frameCanvas, 0, 0, width, height);
      onProgress((i + 1) / frameCount);
      i++;
      setTimeout(step, 33);
    }
    step();
  });
}

// 12-Second Watchdog Wrapper
function withWatchdog(promise, ms = 12000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Hardware encoder watchdog timeout.')), ms))
  ]);
}

async function processConversion(file) {
  const item = document.createElement('div');
  item.className = 'item';
  const thumbUrl = createTrackedUrl(file);

  item.innerHTML = `
    <img src="${thumbUrl}" alt="preview">
    <div>
      <div class="name"></div>
      <div class="meta"><span>${kb(file.size)}</span> · <span class="state">Validating…</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="act"></div>
  `;
  item.querySelector('.name').textContent = file.name;
  list.prepend(item);

  const bar = item.querySelector('.bar i');
  const state = item.querySelector('.state');
  const act = item.querySelector('.act');

  const setProgress = p => { bar.style.width = `${Math.min(100, Math.max(0, p * 100))}%`; };
  const setMeta = txt => { state.textContent = txt; };

  try {
    const { width, height } = await validateGif(file);
    setMeta(`Converting ${width}×${height} (GPU)…`);

    const buffer = await file.arrayBuffer();
    let blob = null;
    let engine = 'GPU';

    const canWebCodecs = ('ImageDecoder' in window) && ('VideoEncoder' in window) && (typeof Mp4Muxer !== 'undefined');

    if (canWebCodecs) {
      try {
        blob = await withWatchdog(convertWebCodecs(buffer, setProgress));
      } catch (err) {
        console.warn('Tier 1 failed, engaging Tier 2 fallback:', err);
        engine = 'Universal Fallback';
        blob = await withWatchdog(convertUniversal(buffer, setProgress));
      }
    } else {
      engine = 'Universal Fallback';
      blob = await withWatchdog(convertUniversal(buffer, setProgress));
    }

    setProgress(1);
    const mp4Url = createTrackedUrl(blob);
    const pct = Math.round((1 - blob.size / file.size) * 100);
    const badgeText = pct > 0 ? `-${pct}%` : `+${Math.abs(pct)}%`;

    state.innerHTML = `
      ${kb(file.size)} → ${kb(blob.size)}
      <span class="badge">${badgeText}</span>
      <span class="engine">${engine}</span>
    `;

    const v = document.createElement('video');
    v.src = mp4Url; v.muted = v.loop = v.autoplay = v.playsInline = true;
    item.querySelector('img').replaceWith(v);
    releaseUrl(thumbUrl);

    const outExt = blob.type.includes('webm') ? '.webm' : '.mp4';
    const outName = file.name.replace(/\.gif$/i, '') + outExt;
    completedItems.push({ name: outName, url: mp4Url });
    updateBatchUI();

    const dlBtn = document.createElement('a');
    dlBtn.className = 'btn';
    dlBtn.href = mp4Url;
    dlBtn.download = outName;
    dlBtn.textContent = 'Download';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn sec';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = async () => {
      try {
        if (navigator.clipboard && window.ClipboardItem && blob.type === 'video/mp4') {
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          copyBtn.textContent = 'Copied!';
        } else {
          await navigator.clipboard.writeText(mp4Url);
          copyBtn.textContent = 'Link Copied';
        }
      } catch (_) {
        copyBtn.textContent = 'Failed';
      }
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    };

    act.append(dlBtn, copyBtn);
    status.textContent = 'Done. Drop more GIFs.';
  } catch (err) {
    console.error(err);
    state.innerHTML = `<span class="err">${err.message || 'Conversion failed'}</span>`;
    status.textContent = 'Error processing file.';
  }
}

function handle(files) {
  const gifs = [...files].filter(f => f.type === 'image/gif' || /\.gif$/i.test(f.name));
  if (!gifs.length) {
    status.textContent = 'No GIF files detected.';
    return;
  }
  gifs.forEach(f => {
    queue = queue.then(() => processConversion(f));
  });
}

function updateBatchUI() {
  if (completedItems.length > 1) {
    batchBar.style.display = 'flex';
    batchCount.textContent = `${completedItems.length} videos converted`;
  }
}

btnDownloadAll.addEventListener('click', async () => {
  for (const item of completedItems) {
    const a = document.createElement('a');
    a.href = item.url;
    a.download = item.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise(r => setTimeout(r, 200));
  }
});

btnClearAll.addEventListener('click', () => {
  activeUrls.forEach(url => URL.revokeObjectURL(url));
  activeUrls.clear();
  completedItems.length = 0;
  list.innerHTML = '';
  batchBar.style.display = 'none';
  status.textContent = 'Ready. Drop GIFs or paste from clipboard.';
});

['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));
input.addEventListener('change', () => { handle(input.files); input.value = ''; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

window.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file') {
      const file = item.getAsFile();
      if (file && (file.type === 'image/gif' || /\.gif$/i.test(file.name))) files.push(file);
    }
  }
  if (files.length) handle(files);
});

window.addEventListener('beforeunload', () => {
  activeUrls.forEach(url => URL.revokeObjectURL(url));
});
</script>
</body>
</html>
